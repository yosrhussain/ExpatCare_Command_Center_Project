<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ExpatCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #D4AF37;
            --blue: #002855;
            --light-blue: #1E4A7C;
            --green: #00A651;
            --white: #FFFFFF;
            --light-gray: #F8F9FA;
            --medium-gray: #E9ECEF;
            --text: #2C3E50;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--blue) 0%, var(--light-blue) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background Animation */
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--gold);
            opacity: 0.08;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); }
            25% { transform: translateY(-150px) translateX(100px) rotate(90deg); }
            50% { transform: translateY(-300px) translateX(-100px) rotate(180deg); }
            75% { transform: translateY(-150px) translateX(100px) rotate(270deg); }
        }

        /* Main Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            animation: slideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header */
        .login-header {
            background: linear-gradient(135deg, var(--gold) 0%, var(--green) 100%);
            padding: 50px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            animation: rotate 25s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .heart-logo {
            width: 70px;
            height: 70px;
            color: var(--white);
            filter: drop-shadow(0 6px 15px rgba(0, 0, 0, 0.25));
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .login-header h1 {
            color: var(--white);
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.95);
            font-size: 15px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        /* Content */
        .login-content {
            padding: 45px 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--blue);
            font-weight: 600;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text);
            font-size: 18px;
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .form-control {
            width: 100%;
            padding: 16px 20px 16px 52px;
            border: 2px solid var(--medium-gray);
            border-radius: 14px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: var(--white);
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 5px rgba(212, 175, 55, 0.12);
        }

        .form-control:focus + .input-icon {
            color: var(--gold);
            transform: translateY(-50%) scale(1.1);
            opacity: 1;
        }

        .form-control.error {
            border-color: #dc3545;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Remember & Forgot */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-password {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: var(--green);
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 16px 30px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--green) 100%);
            color: var(--white);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.45);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Loading Spinner */
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--white);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
            color: var(--text);
            opacity: 0.6;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--medium-gray);
        }

        .divider span {
            padding: 0 15px;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            padding: 25px 40px;
            background: var(--light-gray);
            border-top: 1px solid var(--medium-gray);
        }

        .login-footer p {
            color: var(--text);
            font-size: 14px;
        }

        .login-footer a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: var(--green);
        }

        /* Back to Home */
        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 100;
        }

        .back-home a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-home a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-5px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-container {
                margin: 20px;
            }

            .login-header {
                padding: 40px 30px;
            }

            .login-header h1 {
                font-size: 28px;
            }

            .login-content {
                padding: 35px 30px;
            }

            .login-footer {
                padding: 20px 30px;
            }

            .back-home {
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Background Animation -->
    <div class="particles">
        <div class="particle" style="width: 120px; height: 120px; top: 15%; left: 15%; animation-delay: 0s;"></div>
        <div class="particle" style="width: 180px; height: 180px; top: 65%; left: 75%; animation-delay: 3s;"></div>
        <div class="particle" style="width: 100px; height: 100px; top: 75%; left: 25%; animation-delay: 6s;"></div>
        <div class="particle" style="width: 150px; height: 150px; top: 35%; left: 65%; animation-delay: 9s;"></div>
    </div>

    <!-- Back to Home -->
    <div class="back-home">
        <a href="home.html">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <div class="logo-container">
                <svg class="heart-logo" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    <path d="M12 8v8M8 12h8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to access your ExpatCare dashboard</p>
        </div>

        <!-- Content -->
        <div class="login-content">
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" class="form-control" id="email" placeholder="your.email@example.com" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                    <span class="error-message" id="emailError">Please enter a valid email address</span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                    <span class="error-message" id="passwordError">Password is required</span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <p style="text-align: center; color: var(--text); font-size: 14px;">
                <strong>Demo Account:</strong><br>
                Email: <code style="background: var(--light-gray); padding: 2px 8px; border-radius: 4px;">demo@expatcare.ae</code><br>
                Password: <code style="background: var(--light-gray); padding: 2px 8px; border-radius: 4px;">Demo123!</code>
            </p>
        </div>

        <!-- Footer -->
        <div class="login-footer">
            <p>Don't have an account? <a href="register.html">Create one now</a></p>
        </div>
    </div>

    <script>
        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const loginBtn = document.getElementById('loginBtn');
            
            // Reset errors
            emailInput.classList.remove('error');
            passwordInput.classList.remove('error');
            emailError.style.display = 'none';
            passwordError.style.display = 'none';
            
            let isValid = true;

            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value)) {
                emailInput.classList.add('error');
                emailError.style.display = 'block';
                isValid = false;
            }

            // Validate password
            if (passwordInput.value.length < 6) {
                passwordInput.classList.add('error');
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.style.display = 'block';
                isValid = false;
            }

            if (!isValid) return;

            // Show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<div class="loading-spinner"></div> <span>Signing In...</span>';

            // Simulate API call
            setTimeout(() => {
                // Check credentials
                const users = JSON.parse(localStorage.getItem('expatcare_users') || '[]');
                const user = users.find(u => u.email === emailInput.value && u.password === passwordInput.value);

                // Demo account
                const isDemo = emailInput.value === 'demo@expatcare.ae' && passwordInput.value === 'Demo123!';

                if (user || isDemo) {
                    // Set session
                    const sessionData = {
                        email: emailInput.value,
                        loginTime: new Date().toISOString(),
                        remember: document.getElementById('rememberMe').checked
                    };
                    localStorage.setItem('expatcare_session', JSON.stringify(sessionData));

                    // Success - redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    // Invalid credentials
                    emailInput.classList.add('error');
                    passwordInput.classList.add('error');
                    passwordError.textContent = 'Invalid email or password';
                    passwordError.style.display = 'block';

                    // Reset button
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>Sign In</span> <i class="fas fa-arrow-right"></i>';
                }
            }, 1500);
        });

        // Clear error on input
        document.getElementById('email').addEventListener('input', function() {
            this.classList.remove('error');
            document.getElementById('emailError').style.display = 'none';
        });

        document.getElementById('password').addEventListener('input', function() {
            this.classList.remove('error');
            document.getElementById('passwordError').style.display = 'none';
        });

        // Check if already logged in
        const session = JSON.parse(localStorage.getItem('expatcare_session') || 'null');
        if (session && session.email) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
